# Job Radar settings. Edit this file on GitHub to change what you get alerted about.
# Patterns are case-insensitive regular expressions matched against the job TITLE.

titles:
  # Direct targets: score +45
  core:
    - 'dev\s*ops'
    - 'dev\s*sec\s*ops'
    - 'sec\s*dev\s*ops'
    - 'site reliability'
    - '\bsre\b'
    - '(systems?|software|production|platform|cloud|infrastructure|service|database|network|data) reliability'
    - '\b(customer|build|database) reliability engineer'
    - 'platform (engineer|engineering|operations|ops)'
    - 'infrastructure.{0,30}\b(engineer|engineering|administrator|specialist|operations|ops|analyst|developer|automation)\b'
    - '\b(engineer|engineering|administrator|specialist|operations|developer)\b.{0,30}infrastructure'
    - 'cloud.{0,25}\b(engineer|engineering|operations|infrastructure|ops|platform|developer|administrator|specialist|analyst)\b'
    - '\bcloud\s*ops\b'
    - '\b(aws|azure|gcp|google cloud)\b.{0,25}\b(engineer|administrator|developer|specialist|consultant|architect associate)\b'
    - 'observability'
    - 'kubernetes'
    - '\b(ml|llm|data)\s*ops\b'
    - '(cloud|infrastructure|platform|container|kubernetes|devops|application) security engineer'
    - 'security engineer.{0,25}\b(cloud|devsecops|devops|infrastructure|platform)\b'
    - '\bterraform\b'
  # Closely related roles that lead into DevOps/SRE/cloud: score +30
  bridge:
    - 'systems? administrator'
    - '\bsys\s*admin\b'
    - '\b(linux|unix)\b.{0,20}\b(administrator|admin|engineer|systems)\b'
    - 'production engineer'
    - '(build|release|deployment) engineer'
    - '\b(ci/?cd|build and release|release and build)\b'
    - 'network (engineer|administrator)'
    - '(cloud|aws|azure|kubernetes|infrastructure) support engineer'
    - '\b(cloud|linux|it|infrastructure|network|windows|server|platform|virtualization|storage)\b.{0,20}\bsystems? engineer'
    - 'systems? engineer.{0,25}\b(cloud|linux|it|infrastructure|network|windows|server|aws|azure|virtualization)\b'
    - '(automation|tooling|tools) engineer.{0,25}\b(cloud|infrastructure|devops|platform|it)\b'
    - '\b(cloud|infrastructure|devops|platform)\b.{0,25}(automation|tooling) engineer'
    - 'virtualization (engineer|administrator)'
    - 'storage (engineer|administrator)'
    - 'configuration management'
    - '\bit infrastructure\b'

  # Titles containing any of these are skipped (too senior, or not a fit for F-1/OPT).
  exclude:
    - '\bsenior\b'
    - '\bsr\.?\b'
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\blead\b'
    - '\bmanager\b'
    - '\bdirector\b'
    - '\bhead of\b'
    - '\bvp\b'
    - 'vice president'
    - '\barchitect\b'
    - '\bdistinguished\b'
    - '\bfellow\b'
    - '\bchief\b'
    - '\b(iii|iv|v)\b'
    - '\b(level|lvl)\s*[3-9]\b'
    - '\b[3-9]\b\s*$'
    - '\bsales\b'
    - 'account executive'
    - 'account manager'
    - '\brecruit'
    - '\bmarketing\b'
    - '\bintern(ship)?\b'
    - '\bco-?op\b'
    - '\bsummer\b'
    - '\bphd\b'
    - '\bclearance\b'
    - '\bts/sci\b'
    - '\btop secret\b'
    - 'electrical'
    - 'electrician'
    - 'mechanical'
    - 'civil'
    - 'construction'
    - 'facilit(y|ies)'
    - '\bhvac\b'
    - 'physical security'
    - 'paralegal'
    - '\blegal\b'
    - '\bcounsel\b'
    - 'attorney'
    - 'documentation'
    - 'technical writer'
    - 'maintenance'
    - 'design release'
    - 'casting'
    - 'manufacturing'
    - 'welding'
    - 'machining'
    - '\bmechanic'
    - 'test (infrastructure )?technician'
    - '\baccount(ant|ing)\b'
    - '\bfinance\b'
    - '\bmgr\b'
    - '\bavp\b'
    - '\bmanger\b'
    - 'professor|lecturer|faculty'
    - '\bclassified\b'
    - '\b(m/w/d|w/m/d|m/f/d|f/h|h/f)\b'
    - '\bing[ée]nieur|\bstage\b|alternance|\bwerkstudent'
    - 'design (and|&) release'
    - '\b(billing|payroll|cmms|membership|pacs|gainsight|customer success|crm|hris|lms|epic|maestro|erp|hr) systems? administrator'
    - '\b(billing|payroll|cmms|membership|pacs|gainsight|crm|hris|lms|epic|erp)\b.{0,20}administrator'
