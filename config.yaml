# Every Workday board is read every run, newest jobs first, until its jobs are older than 7 days
# (or `max_pages` x 20 jobs).
workday:
  shards: 1
  max_pages: 15
  search_terms: ['devops', 'site reliability', 'sre', 'cloud engineer', 'platform engineer', 'infrastructure engineer', 'kubernetes', 'systems development engineer']   # big boards: also search these
  search_pages: 3

notify:
  daily_digest_hour_local: 8      # send a daily summary at this hour
  timezone: 'America/Chicago'

# No AI check for this profile.
ai:
  mode: off

# Boards found automatically (discovered.csv, refreshed weekly): all of them are read every run.
discovery:
  boards_per_run: 100000

run:
  time_budget_minutes: 22

# REPORT.md and the page: every match posted in the last 7 days, newest first, grouped by day.
report:
  order: newest
  days: 7
  hide_years: 5           # also hides older saved rows that ask for 5+ years
  track_closed: true       # leave out jobs whose posting was taken down (boards that list every job)
  label: 'DevOps / SRE / Cloud / Platform jobs in the US'

# Jobs from outside the employers' own boards (radar/sources.py). A job already found on an employer's
# board is not listed twice. Each source is read at most every `every_minutes`.
sources:
  email_alerts: true       # JOB_ALERTS_EMAIL + JOB_ALERTS_APP_PASSWORD (alert emails from LinkedIn, Indeed, Dice...)
  email_days: 4
  adzuna:                  # ADZUNA_APP_ID + ADZUNA_APP_KEY; the free key is shared with the automotive radar
    calls_per_run: 1       # 48 runs a day
    limits: {d: 45, w: 300, m: 1300}
    max_days_old: 7
    terms:
      - 'devops engineer'
      - 'site reliability engineer'
      - 'cloud engineer'
      - 'platform engineer'
      - 'infrastructure engineer'
      - 'kubernetes engineer'
      - 'devsecops engineer'
      - 'cloud operations engineer'
      - 'build and release engineer'
      - 'aws engineer'
      - 'azure engineer'
      - 'linux systems engineer'
  workable_search:         # Workable's public search across every company that uses Workable
    every_minutes: 180
    days: 7
    max_pages: 40
    terms: ['devops', 'site reliability', 'cloud engineer', 'platform engineer', 'infrastructure engineer', 'kubernetes']
  hn:                      # Hacker News "Who is hiring?" (official API)
    every_minutes: 360
    days: 7
  remoteok:                # credited and linked back in the report
    every_minutes: 120
    days: 7
    tag: devops
  wwr:                     # We Work Remotely RSS; credited and linked back in the report
    every_minutes: 60
    days: 7
    feeds:
      - 'https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss'
  usajobs:                 # USAJOBS_API_KEY + USAJOBS_EMAIL; jobs needing citizenship/clearance are left out
    every_minutes: 180
    days: 7
    keywords: ['devops', 'site reliability', 'cloud engineer', 'platform engineer', 'kubernetes']
    series: ['2210']       # IT management (most federal IT jobs)
