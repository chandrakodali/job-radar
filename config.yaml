# Workday boards are checked in rotation (each one every N runs) to stay polite.
workday:
  shards: 4
  max_pages: 5

notify:
  daily_digest_hour_local: 8      # send a daily summary at this hour
  timezone: 'America/Chicago'

# Optional AI check of every new match (turns on when an AI key secret exists; see radar/ai.py).
ai:
  max_requests_per_run: 6   # 5 jobs per request; keeps well inside free-tier daily limits

# Boards found automatically (discovered.csv, refreshed weekly) are checked on a rotation.
discovery:
  boards_per_run: 1500
