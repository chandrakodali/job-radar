# Job Radar settings. Edit this file on GitHub to change what you get alerted about.
# Patterns are case-insensitive regular expressions matched against the job TITLE.

titles:
  # Unmistakable SRE / DevOps titles. These are always kept unless `hard_exclude` matches (so a word like
  # "voice", "manufacturing", "SAP" or "maintenance" elsewhere in the title can't drop them).
  strong:
    - 'site\s*-?\s*reliability'
    - '\bs\.?r\.?e\.?s?\b'
    - 'dev\s*-?\s*(sec\s*)?ops'
    - '\b(systems?|software|production|platform|cloud|infrastructure|service|services|database|network|data|application|app|web|api|ml|ai|gpu|compute|storage|kubernetes|container|edge|cdn|devops|it|operations|technical|tech|reliability) reliability engineer'
    - '\bsystems development engineer\b'   # Amazon's name for its SRE-style infrastructure engineers
    - '\bchaos engineer'
  # Exclusions that still apply to the titles above.
  hard_exclude:
    - '\b(staff|principal|lead|manager|director|head of|vp|vice president|architect|distinguished|fellow|chief)\b'
    - '\b(iv|v|vi)\b'
    - '\b(level|lvl)\s*[4-9]\b'
    - '\b[4-9]\b\s*$'
    - '\b(intern(ship)?|co-?op|summer|phd|apprenticeship program)\b'
    - '\b(clearance|ts/sci|top secret|classified)\b'
    - '\b(sales|pre-?sales|recruit\w*|marketing|teacher|instructor|trainer)\b'
    - '\b(m/w/d|w/m/d|m/f/d|f/h|h/f)\b'
    - '\bmgr\b'

  # Direct targets: score +45
  core:
    - '\b(software|systems?|infrastructure|cloud|platform|production|kubernetes|services?)\b.{0,40}\breliability\b'
    - '\breliability\b.{0,40}\b(software|infrastructure|cloud|platform|kubernetes|services?|sre|devops|production systems)\b'
    - 'production engineer.{0,30}\b(software|infrastructure|cloud|systems|platform|network|linux|services?)\b'
    - '\b(software|infrastructure|systems|platform|cloud|network) production engineer'
    - '\b(resilience|resiliency) engineer.{0,30}\b(cloud|platform|infrastructure|software|technology|it|sre)\b'
    - '\b(cloud|platform|infrastructure|technology|software|it|sre) (resilience|resiliency) engineer'
    - 'on-?call engineer'
    - 'incident (management|response) engineer.{0,30}\b(cloud|platform|infrastructure|sre|production|services?)\b' 
    - 'dev\s*ops'
    - 'dev\s*sec\s*ops'
    - 'sec\s*dev\s*ops'
    - 'site reliability'
    - '\bsre\b'
    - '(systems?|software|production|platform|cloud|infrastructure|service|database|network|data) reliability'
    - '\b(customer|build|database) reliability engineer'
    - 'platform (engineer|engineering|operations|ops)'
    - 'infrastructure.{0,30}\b(engineer|engineering|administrator|specialist|operations|ops|analyst|developer|automation)\b'
    - '\b(engineer|engineering|administrator|specialist|operations|developer)\b.{0,30}infrastructure'
    - 'cloud.{0,25}\b(engineer|engineering|operations|infrastructure|ops|platform|developer|administrator|specialist|analyst)\b'
    - '\bcloud\s*ops\b'
    - '\b(aws|azure|gcp|google cloud)\b.{0,25}\b(engineer|administrator|developer|specialist|consultant|architect associate)\b'
    - 'observability'
    - 'kubernetes'
    - '\b(ml|llm|data)\s*ops\b'
    - '(cloud|infrastructure|platform|container|kubernetes|devops|application) security engineer'
    - 'security engineer.{0,25}\b(cloud|devsecops|devops|infrastructure|platform)\b'
    - '\bterraform\b'
  # Closely related roles that lead into DevOps/SRE/cloud: score +30
  bridge:
    # Kept only when the job text names DevOps/SRE work (see scoring.bridge_evidence):
    - '\breliability engineer'                 # also a manufacturing / mechanical title
    - '\b(resilience|resiliency) engineer'
    - 'production (operations|support|systems) engineer'
    - '\b(technical|tech|systems?|site|service|production|saas|web|it|network) operations engineer'
    - '\btech\s*ops\b'
    - '\b(monitoring|telemetry|performance and reliability|capacity) engineer'
    - '\bnoc engineer'
    - 'application support engineer'
    - 'systems? administrator'
    - '\bsys\s*admin\b'
    - '\b(linux|unix)\b.{0,20}\b(administrator|admin|engineer|systems)\b'
    - 'production engineer'
    - '(build|release|deployment) engineer'
    - '\b(ci/?cd|build and release|release and build)\b'
    - 'network (engineer|administrator)'
    - '(cloud|aws|azure|kubernetes|infrastructure) support engineer'
    - '\b(cloud|linux|it|infrastructure|network|windows|server|platform|virtualization|storage)\b.{0,20}\bsystems? engineer'
    - 'systems? engineer.{0,25}\b(cloud|linux|it|infrastructure|network|windows|server|aws|azure|virtualization)\b'
    - '(automation|tooling|tools) engineer.{0,25}\b(cloud|infrastructure|devops|platform|it)\b'
    - '\b(cloud|infrastructure|devops|platform)\b.{0,25}(automation|tooling) engineer'
    - 'virtualization (engineer|administrator)'
    - 'storage (engineer|administrator)'
    - 'configuration management'
    - '\bit infrastructure\b'

  # Senior-level titles are KEPT when the job text asks for under 5 years (or states no years: then they
  # are listed and marked "senior title, years not stated"). Jobs asking for 5+ years go to the hidden list.
  senior:
    - '\bsenior\b'
    - '\bsr\.?\b'
    - '\biii\b'
    - '\b(level|lvl)\s*3\b'
    - '\b3\s*$'

  # Titles containing any of these are skipped (well above 5 years, or not this kind of job).
  exclude:
    - '\bstaff\b'
    - '\bprincipal\b'
    - '\blead\b'
    - '\bmanager\b'
    - '\bdirector\b'
    - '\bhead of\b'
    - '\bvp\b'
    - 'vice president'
    - '\barchitect\b'
    - '\bdistinguished\b'
    - '\bfellow\b'
    - '\bchief\b'
    - '\b(iv|v|vi)\b'
    - '\b(level|lvl)\s*[4-9]\b'
    - '\b[4-9]\b\s*$'
    - '\bsales\b'
    - 'account executive'
    - 'account manager'
    - '\brecruit'
    - '\bmarketing\b'
    - '\bintern(ship)?\b'
    - '\bco-?op\b'
    - '\bsummer\b'
    - '\bphd\b'
    - '\bclearance\b'
    - '\bts/sci\b'
    - '\btop secret\b'
    - 'electrical'
    - 'electrician'
    - 'mechanical'
    - 'civil'
    - 'construction'
    - 'facilit(y|ies)'
    - '\bhvac\b'
    - 'physical security'
    - 'paralegal'
    - '\blegal\b'
    - '\bcounsel\b'
    - 'attorney'
    - 'documentation'
    - 'technical writer'
    - 'maintenance'
    - 'design release'
    - 'casting'
    - 'manufacturing'
    - 'welding'
    - 'machining'
    - '\bmechanic'
    - 'test (infrastructure )?technician'
    - '\baccount(ant|ing)\b'
    - '\bfinance\b'
    - '\bmgr\b'
    - '\bavp\b'
    - '\bmanger\b'
    - 'professor|lecturer|faculty'
    - '\bclassified\b'
    - '\b(m/w/d|w/m/d|m/f/d|f/h|h/f)\b'
    - '\bing[ée]nieur|\bstage\b|alternance|\bwerkstudent'
    - 'design (and|&) release'
    - '\b(billing|payroll|cmms|membership|pacs|gainsight|customer success|crm|hris|lms|epic|maestro|erp|hr) systems? administrator'
    - '\b(billing|payroll|cmms|membership|pacs|gainsight|crm|hris|lms|epic|erp)\b.{0,20}administrator'
    - '\bassembly\b'
    - 'broadcast'
    - 'energy storage|battery|charging|\bev\b|sustainability|electrical infrastructure|power systems'
    - 'power platform'
    - '\bi&c\b|instrumentation'
    - '\bsalesforce\b'
    - 'servicenow'
    - '\bsap\b'
    - '\bworkday\b'
    - '\b(dynamics|netsuite|oracle (ebs|fusion|apps))\b'
    - 'help ?desk'
    - 'desktop support'
    - '\bdata cent(er|re) technician'
    - '\btechnician\b'
    - 'customer support'
    - '\bvoice\b'
    - '\bpre-?sales\b'
    - 'solutions? engineer'
    - 'field engineer'
    - '\bteacher\b|\binstructor\b|\btrainer\b'

  # Entry-level signals in the title: score +15
  entry:
    - '\bjunior\b'
    - '\bjr\.?\b'
    - '\bassociate\b'
    - '\bentry\b'
    - 'new grad'
    - '\bgraduate\b'
    - 'early career'
    - 'university (grad|graduate|hire|program|recruit)'
    - '\bapprentice'
    - '\b(engineer|administrator|technician|analyst|specialist|developer)\s+(i|1)\b'
    - '\b(level|lvl)\s*1\b'

# Description checks (applied when the job text is available).
description:
  # Hidden from phone alerts: F-1/OPT holders can't meet these.
  blockers:
    - '(security|secret|top secret|ts/sci|ts|sci|dod|public trust)\s+clearance'
    - 'clearance (is |will be )?required'
    - 'active (secret|top secret|ts/sci|ts)\b'
    - 'ability to (obtain|maintain) (a |an )?(\w+ )?(security )?clearance'
    - 'must (be|hold) (a |an )?(u\.?s\.?|united states) citizen'
    - '(u\.?s\.?|united states) citizenship (is )?(required|is a requirement|needed)'
    - 'requires? (u\.?s\.?|united states) citizenship'
    - '(must be|only) (a )?(u\.?s\.?|us) persons?'
    - '\bitar\b'
    - 'export control.{0,80}(u\.?s\.? person|citizen)'
  # These cancel a blocker match if they appear right where the blocker matched.
  blocker_exceptions:
    - 'no (security )?clearance (is )?required'
    - 'clearance (is )?not required'
    - 'does not require (a |an )?(security )?clearance'
  no_sponsorship:
    - '(not|unable to|cannot|can.t|will not|won.t|does not|do not|is not able to)\s+(provide |offer |support )?(employment |work )?(visa )?sponsor'
    - 'sponsorship (is )?(not|un)available'
    - 'without (the )?(need for )?(current or future |now or in the future )?(employer |visa )?sponsorship'
    - 'now or in the future.{0,60}sponsor'
  sponsors:
    - 'visa sponsorship (is )?available'
    - 'will sponsor'
    - 'sponsorship (is )?available'
    - 'open to sponsor'
  e_verify:
    - 'e-?verify'

# Company names that look like IT staffing/consulting firms get a caution flag (SEVP warns about these for STEM OPT).
staffing_company_patterns:
  - 'consult'
  - 'staffing'
  - 'recruit'
  - 'talent'
  - 'infotech'
  - '\bit solutions\b'
  - 'technologies llc'
  - 'systems llc'

scoring:
  alert_threshold: 45        # phone alerts only at or above this score
  max_alerts_per_run: 15     # the rest go into one summary message
  max_post_age_days: 10      # ignore jobs posted longer ago than this (the report shows the last 7 days)
  years_by_section: true     # years read from required/duties text, ranges by their low end, "preferred" ignored
  degree: master             # "BS + 5 years or MS + 3 years" counts as 3
  hide_if_years_at_least: 5
  # Adjacent titles (sysadmin, network, production, systems engineer...) are kept only when the job text
  # names at least `bridge_min` of these DevOps/cloud tool groups; the rest go to the "left out" list.
  bridge_min: 2
  bridge_evidence:
    - '\b(kubernetes|k8s|eks|aks|gke|openshift)\b'
    - '\b(docker|containers?|podman)\b'
    - '\b(terraform|cloudformation|pulumi|bicep|cdk)\b'
    - '\b(ansible|puppet|chef|saltstack)\b'
    - '\b(ci/?cd|jenkins|github actions|gitlab|circleci|argo ?cd|azure devops|teamcity|bamboo)\b'
    - '\b(aws|amazon web services|azure|gcp|google cloud)\b'
    - '\b(prometheus|grafana|datadog|splunk|elk|elasticsearch|new relic|observability)\b'
    - '\b(python|bash|shell scripting|powershell|golang)\b'
    - '\b(infrastructure as code|iac)\b'
    - '\b(helm|istio|service mesh|hashicorp vault)\b'
    - '\b(slos?|slis?|slas?|error budgets?|service level objectives?)\b'
    - '\b(post-?mortems?|pager ?duty|opsgenie|incident\.io|blameless)\b'
    - '\blinux\b'
    - '\b(high availability|disaster recovery|fault[- ]toleran\w+|load balanc\w+|distributed systems)\b'
  # jobs asking for 5+ years go to the hidden list
  block_alerts_if_years_at_least: 5

