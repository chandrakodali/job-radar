name: aiprobe
on:
  push:
    branches: [ai-probe]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try GitHub Models
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body='{"model":"openai/gpt-4.1-mini","messages":[{"role":"user","content":"Reply with JSON {\"ok\":true}"}]}'
          for u in https://models.github.ai/inference/chat/completions https://models.github.ai/orgs/chandrakodali/inference/chat/completions https://models.inference.ai.azure.com/chat/completions; do
            echo "== $u"
            curl -sS -D - -o /tmp/b -w "code=%{http_code} redirect=%{redirect_url}\n" "$u" \
              -H "Authorization: Bearer $GH_TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" -d "$body" | head -25
            echo "BODY:"; head -c 600 /tmp/b; echo
          done
          echo "== catalog"; curl -sS -w "\ncode=%{http_code}\n" https://models.github.ai/catalog/models -H "Authorization: Bearer $GH_TOKEN" | head -c 800
          echo; echo "== proxy env"; env | grep -i proxy || true
