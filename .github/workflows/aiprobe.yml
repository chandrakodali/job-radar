name: aiprobe
on:
  push:
    branches: [ai-probe]
permissions:
  contents: read
  models: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Reachability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for u in https://models.github.ai/catalog/models https://api.openai.com/v1/models https://api.anthropic.com/v1/models https://generativelanguage.googleapis.com/v1beta/models https://api.groq.com/openai/v1/models https://openrouter.ai/api/v1/models https://api.github.com/ https://boards-api.greenhouse.io/v1/boards/gitlab/jobs; do
            printf "%s -> " "$u"; curl -sS -m 15 -o /tmp/b -w "%{http_code} %{content_type} ip=%{remote_ip}" "$u" 2>&1; echo " | $(head -c 120 /tmp/b | tr '\n' ' ')"
          done
          getent hosts models.github.ai api.openai.com || true
