name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Workday 422s and RANE
        shell: python
        run: |
          import json, urllib.request, urllib.error
          def call(url, data=None):
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data is not None else None,
                    headers={"User-Agent":"job-radar-probe","Content-Type":"application/json","Accept":"application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, r.read()[:300]
              except urllib.error.HTTPError as e: return e.code, e.read()[:300]
              except Exception as e: return 0, repr(e)
          for t,wd,site in [("netflix","wd1","Netflix"),("dell","wd1","External"),("comcast","wd5","Comcast_Careers"),("redfin","wd1","redfin_careers")]:
              base=f"https://{t}.{wd}.myworkdayjobs.com/wday/cxs/{t}/{site}/jobs"
              for body in [{"appliedFacets":{},"limit":20,"offset":0,"searchText":""},{"limit":20,"offset":0,"searchText":""},{"appliedFacets":{},"limit":10,"offset":0,"searchText":""},{"appliedFacets":{},"limit":20,"offset":0,"searchText":"engineer"}]:
                  print(t, json.dumps(body), call(base, body)[:2])
          for u in ["https://boards-api.greenhouse.io/v1/boards/lhvuk/jobs","https://boards-api.greenhouse.io/v1/boards/speechmatics/jobs","https://job-boards.eu.greenhouse.io/speechmatics"]:
              s,b=call(u); print(u,s,b[:120])
          for slug in ["rane","ranenetwork","ranenetworkinc","rane-network","ranegroup"]:
              for u in [f"https://boards-api.greenhouse.io/v1/boards/{slug}",f"https://api.lever.co/v0/postings/{slug}?mode=json",f"https://api.ashbyhq.com/posting-api/job-board/{slug}"]:
                  s,b=call(u); print(slug,u.split('/')[2],s,b[:80])
