name: probe
# Temporary helper while adding employers: runs scripts/probe.py on GitHub's servers (job sites are not
# reachable from where the radar is developed). Removed once the employer list is settled.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe.py
