name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe more ATS feeds
        shell: python
        run: |
          import json, urllib.request, urllib.error
          def call(url, data=None, method=None):
              h={"User-Agent":"job-radar/1.0 (+https://github.com/chandrakodali/job-radar)","Accept":"application/json, text/xml, */*","Content-Type":"application/json"}
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data is not None else None, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r: return r.status, r.headers.get('content-type',''), r.read()
              except urllib.error.HTTPError as e: return e.code, e.headers.get('content-type',''), e.read()
              except Exception as e: return 0, '', repr(e).encode()
          def keys(o, depth=0):
              if isinstance(o, dict): return {k: keys(v, depth+1) if depth < 3 else type(v).__name__ for k, v in o.items()}
              if isinstance(o, list): return [keys(o[0], depth+1)] if o else []
              return (str(o)[:60] if o is not None else None)
          def show(name, url, data=None):
              s, ct, b = call(url, data, "POST" if data is not None else None)
              print("=====", name, s, len(b))
              try: print(json.dumps(keys(json.loads(b)), indent=1)[:3500])
              except Exception: print(b[:500])
          pass  # show("oracle list", "https://eedu.fa.em3.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList.secondaryLocations&finder=findReqs;siteNumber=CX_1003,limit=2,sortBy=POSTING_DATES_DESC")
          s, ct, b = call("https://eedu.fa.em3.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitions?onlyData=true&expand=requisitionList&finder=findReqs;siteNumber=CX_1003,limit=1,sortBy=POSTING_DATES_DESC")
          rid = json.loads(b)["items"][0]["requisitionList"][0]["Id"]
          show("oracle detail", f'https://eedu.fa.em3.oraclecloud.com/hcmRestApi/resources/latest/recruitingCEJobRequisitionDetails?expand=all&onlyData=true&finder=ById;Id=%22{rid}%22,siteNumber=CX_1003')
          s, ct, b = call("https://apply.workable.com/api/v3/accounts/genetec-inc/jobs", {"query":""}, "POST")
          sc = json.loads(b)["results"][0]["shortcode"]
          show("workable detail", f"https://apply.workable.com/api/v2/accounts/genetec-inc/jobs/{sc}")
          show("rippling detail", "https://ats.rippling.com/api/v2/board/flexai/jobs/03ff755a-8e42-4bb6-a87c-58c85a59ff25")
          show("bamboo detail", "https://asuresoftware.bamboohr.com/careers/774/detail")
          show("recruitee keys", "https://bunq.recruitee.com/api/offers/")
          s, ct, b = call("https://personio.jobs.personio.de/xml?language=en")
          print("===== personio", s, b[:300])
