name: probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Workday ordering and facets
        shell: python
        run: |
          import json, urllib.request
          def post(url, data):
              req = urllib.request.Request(url, data=json.dumps(data).encode(), headers={"User-Agent":"job-radar-probe","Content-Type":"application/json","Accept":"application/json"})
              with urllib.request.urlopen(req, timeout=30) as r: return json.loads(r.read())
          for t, wd, site in [("nvidia","wd5","NVIDIAExternalCareerSite"),("autodesk","wd1","Ext"),("motorolasolutions","wd5","Careers"),("marvell","wd1","MarvellCareers")]:
              base=f"https://{t}.{wd}.myworkdayjobs.com/wday/cxs/{t}/{site}/jobs"
              try:
                  r=post(base,{"appliedFacets":{},"limit":20,"offset":0,"searchText":""})
                  print("=====",t,"total",r.get("total"))
                  print([j.get("postedOn") for j in r["jobPostings"]])
                  for f in r.get("facets",[]):
                      vals=f.get("values",[])
                      sub=[]
                      for v in vals:
                          if "values" in v: sub+= [(x.get("descriptor"),x.get("id")) for x in v["values"] if "United States" in (x.get("descriptor") or "")]
                          elif "United States" in (v.get("descriptor") or ""): sub.append((v.get("descriptor"),v.get("id")))
                      print("  facet",f.get("facetParameter"),f.get("descriptor"),sub[:3])
                  r2=post(base,{"appliedFacets":{},"limit":20,"offset":0,"searchText":"engineer"})
                  print("  search 'engineer' postedOn:",[j.get("postedOn") for j in r2["jobPostings"]])
              except Exception as e: print("=====",t,"ERROR",repr(e))
