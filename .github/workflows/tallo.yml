name: Tallo job crawler

on:
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:
    inputs:
      probe:
        description: Capture four probe pages for selector review
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tallo-crawler
  cancel-in-progress: false

defaults:
  run:
    working-directory: tallo-crawler

jobs:
  crawl:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tallo-crawler/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - id: crawl
        name: Run crawler
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PROBE: ${{ inputs.probe }}
        run: |
          if [ "$PROBE" = "true" ]; then
            python tallo_crawler.py --probe
          else
            python tallo_crawler.py
          fi
      - name: Describe probe pages
        if: ${{ always() && inputs.probe }}
        run: |
          ls -la data/probe || true
          for f in data/probe/*; do
            echo "== $f $(wc -c < "$f") bytes"
            echo "job links: $(grep -o '/talent/job/technology/[^\"]*' "$f" | wc -l)  browse links: $(grep -o '/talent/job/browse/[^\"]*' "$f" | wc -l)"
            grep -o '/talent/job/technology/[^\"]*' "$f" | head -3
            grep -oE '__NEXT_DATA__|self.__next_f|application/ld\+json|/api/[A-Za-z0-9_/.-]+|graphql|wp-json[A-Za-z0-9_/.-]*|admin-ajax[^\"]*' "$f" | sort | uniq -c | head -15
            grep -oiE 'posted[^<]{0,40}' "$f" | head -3
          done
          python - <<'PY'
          import re, glob
          for f in glob.glob('data/probe/job*.html'):
              h = open(f, encoding='utf-8', errors='replace').read()
              print('== headings in', f)
              for m in re.finditer(r'<(h[1-4])([^>]*)>(.*?)</\1>', h, re.S):
                  print(m.group(1), re.sub(r'\s+', ' ', m.group(2))[:120], '|', re.sub(r'<[^>]+>', ' ', m.group(3)).strip()[:120])
              i = h.find('ReportShare') if 'ReportShare' in h else h.find('Report')
              j = h.find('Apply Offsite')
              print('== html around Apply Offsite:')
              print(re.sub(r'\s+', ' ', h[j:j+2500]))
          PY
      - name: Save probe captures
        if: ${{ always() && (inputs.probe || steps.crawl.outcome == 'failure') }}
        uses: actions/upload-artifact@v6
        with:
          name: tallo-probe
          path: tallo-crawler/data/probe/
          if-no-files-found: ignore
      - name: Commit crawler progress
        if: ${{ always() && !inputs.probe && (steps.crawl.outcome == 'success' || steps.crawl.outcome == 'failure') }}
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          if [ ! -d data ]; then exit 0; fi
          git add -A -- data/
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Tallo crawler progress"
          for i in 1 2 3; do
            git pull --rebase origin "$TARGET_BRANCH" && git push origin "HEAD:refs/heads/$TARGET_BRANCH" && exit 0
            sleep 5
          done
          exit 1
