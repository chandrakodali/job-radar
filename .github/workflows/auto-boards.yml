name: auto-boards

# Checks that every board in a profile's employer list still answers, and looks for the job boards of
# the employers in employers.csv. Prints a report; nothing is changed. Run from Actions -> auto-boards.
on:
  workflow_dispatch:
    inputs:
      check_only:
        description: 'Only re-check companies.csv (skip looking for new boards)'
        type: boolean
        default: false
  schedule:
    - cron: '47 11 * * 3'   # Wednesdays

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check boards
        run: |
          ARGS=""
          if [ "${{ inputs.check_only }}" = "true" ]; then ARGS="--check"; fi
          python scripts/find_auto_boards.py --profile automotive $ARGS | tee boards.md
          { echo '### Automotive boards'; echo; sed -n '/^## Boards/,$p' boards.md; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: boards-report
          path: profiles/automotive/boards_report.csv
