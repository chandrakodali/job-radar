name: probe-readers
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'comma list of systems'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/probe_readers.py "${{ inputs.only }}"
