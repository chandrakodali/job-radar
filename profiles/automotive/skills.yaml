# Skills dictionary for the rule-based fit score (radar/rank.py).
#
# re:     pattern looked for in the job text (case-insensitive unless it starts with (?-i:...))
# weight: how central the skill is in this kind of job: 3 = defining, 2 = normal, 1 = generic
# have:   how clearly the resume shows it: 1 = clearly, 0.5 = partly/basic, 0 = not at all
#
# Skills with have: 0 matter as much as the ones on the resume: a job that requires many of them scores
# lower and lists them under "missing". Change "have" when the resume changes.

skills:
  model_based:
    MATLAB: {re: '\bmatlab\b', weight: 2, have: 1}
    Simulink: {re: '\bsimulink\b', weight: 3, have: 1}
    Stateflow: {re: '\bstateflow\b', weight: 3, have: 1}
    Embedded Coder: {re: '\bembedded\s*coder\b|\breal[\s-]*time workshop\b|\brtw\b', weight: 3, have: 1}
    TargetLink: {re: '\btarget\s*link\b', weight: 3, have: 1}
    Model-based design: {re: '\bmodel[\s-]*based\s+(design|development|software|engineering|controls?|systems?|approach|methods?|tools?)\b|\bmbd\b|\bmbse\b', weight: 3, have: 1}
    Auto code generation: {re: '\b(auto(matic)?|production|autogenerated)[\s-]*code[\s-]*(generation|gen)\b|\bauto[\s-]*cod(e|ing)\b|\bcode generation\b|\bautogen\b', weight: 2.5, have: 1}
    Reactis: {re: '\breactis\b', weight: 2, have: 1}
    Model checks (MXAM/MAAB/Model Advisor): {re: '\bmxam\b|\bmaab\b|\bmab guidelines\b|\bmodel advisor\b|\bjmaab\b', weight: 2, have: 1}
    Simulink Test/Design Verifier: {re: '\bsimulink (test|design verifier|coverage|check)\b|\bsldv\b', weight: 2, have: 0.7}
    Simulation and modeling: {re: '\b(plant|system|vehicle) model(s|ing|ling)?\b|\bsimulation models?\b', weight: 1.5, have: 0.7}

  autosar:
    AUTOSAR Classic: {re: '\bautosar\b(?!\s+adaptive)', weight: 3, have: 1}
    AUTOSAR Adaptive: {re: '\bautosar\s+adaptive\b|\badaptive\s+autosar\b|\bara::|\bsome/?ip\b.{0,40}\badaptive\b', weight: 2.5, have: 0}
    DaVinci Developer/Configurator: {re: '(?-i:\bDaVinci\b)(?!\s+Resolve)|\bda\s?vinci\s+(developer|configurator)\b', weight: 2.5, have: 1}
    SWC/RTE design: {re: '\b(software components?|swcs?)\b|\brte\b|\barxml\b|\bsender[\s/-]*receiver\b|\bclient[\s/-]*server interfaces?\b', weight: 2, have: 0.8}
    BSW/MCAL configuration: {re: '\bbsw\b|\bbasic software\b|\bmcal\b|\bcomplex device drivers?\b|\bcdd\b|\bautosar (os|com|stack|configuration)\b|\bcomstack\b', weight: 2.5, have: 0.3}
    Other AUTOSAR tools (EB tresos/ISOLAR): {re: '\btresos\b|\bisolar\b|\betas rta\b', weight: 2, have: 0.4}

  verification:
    MIL testing: {re: '\b(mil|model[\s-]*in[\s-]*(the[\s-]*)?loop)\b', weight: 2.5, have: 1}
    SIL testing: {re: '\b(sil|software[\s-]*in[\s-]*(the[\s-]*)?loop)\b(?!\s*\d)', weight: 2.5, have: 1}
    HIL testing: {re: '\b(hil|hardware[\s-]*in[\s-]*(the[\s-]*)?loop)\b', weight: 2.5, have: 0}
    dSPACE: {re: '\bdspace\b|\bscalexio\b|\bcontroldesk\b|\bautomationdesk\b', weight: 2, have: 0}
    NI tools (LabVIEW/TestStand/VeriStand): {re: '\blabview\b|\bteststand\b|\bveristand\b|\bpxi\b', weight: 2, have: 0}
    Unit testing: {re: '\bunit[\s-]*test', weight: 1.5, have: 1}
    Unit test tools (VectorCAST/Tessy/Cantata/LDRA): {re: '\bvectorcast\b|\btessy\b|\bcantata\b|\bldra\b|\bgoogle ?test\b|\bgtest\b', weight: 1.5, have: 0.3}
    Code coverage (MC/DC): {re: '\bcode coverage\b|\bmc/?dc\b|\bstructural coverage\b|\bdecision coverage\b', weight: 1.5, have: 0.7}
    Test automation scripting: {re: '\btest automation\b|\bautomated test(s|ing)?\b|\btest scripts?\b', weight: 1.5, have: 0.3}
    Requirements-based testing: {re: '\brequirements?[\s-]*based test|\btest cases?\b.{0,40}\brequirements?\b|\btest (specifications?|plans?|procedures?)\b', weight: 1.5, have: 1}
    Vehicle/bench testing: {re: '\bvehicle (testing|validation|level test)|\bin[\s-]vehicle\b|\btest (track|vehicles?)\b|\bbench test', weight: 1.5, have: 0.2}

  code_quality:
    Polyspace: {re: '\bpolyspace\b', weight: 2.5, have: 1}
    MISRA C: {re: '\bmisra\b', weight: 2.5, have: 1}
    Static analysis (QAC/Coverity/Klocwork): {re: '\bstatic (code )?analysis\b|\bqa[\s-]?c\b|\bhelix qac\b|\bcoverity\b|\bklocwork\b|\bcppcheck\b|\bpc-lint\b|\bastr[eé]e\b', weight: 2, have: 0.8}
    Code reviews: {re: '\bcode reviews?\b|\bpeer reviews?\b', weight: 1, have: 1}

  standards_process:
    ISO 26262: {re: '\b26262\b|\basil(\s*-?\s*[a-d])?\b', weight: 3, have: 1}
    Functional safety: {re: '\bfunctional safety\b|\bfusa\b|\bsafety[\s-]critical\b|\bsafety (analysis|concept|requirements?|case)\b|\bfmea\b|\bfta\b|\bhara\b', weight: 2.5, have: 1}
    ASPICE: {re: '\ba-?spice\b|\bautomotive spice\b', weight: 2.5, have: 1}
    V-model: {re: '\bv[\s-]*(model|cycle)\b', weight: 1.5, have: 1}
    SOTIF (ISO 21448): {re: '\bsotif\b|\b21448\b', weight: 2, have: 0}
    Cybersecurity (ISO 21434): {re: '\b21434\b|\bcyber[\s-]?security\b|\bunece r155\b|\bsecure boot\b|\bhsm\b', weight: 2, have: 0}
    Aerospace/industrial safety (DO-178C/IEC 61508): {re: '\bdo[\s-]?178\b|\bdo[\s-]?254\b|\bdo[\s-]?331\b|\biec ?61508\b|\biec ?62304\b|\barp ?4754\b', weight: 2, have: 0.2}
    Agile/Scrum/Jira: {re: '\bagile\b|\bscrum\b|\bjira\b|\bsafe\b(?= (framework|agile))', weight: 1, have: 0.5}

  requirements:
    Requirements engineering: {re: '\brequirements? (engineering|management|traceability|analysis|development|definition|elicitation|decomposition)\b|\bsoftware requirements?\b|\bderive(d)? requirements\b|\btraceability\b', weight: 2, have: 1}
    IBM DOORS/DNG: {re: '(?-i:\bDOORS\b)|\b(ibm|rational)\s+doors\b|\bdoors\s*(ng|next)\b|\bdng\b', weight: 2, have: 1}
    Polarion/Jama/codebeamer: {re: '\bpolarion\b|\bjama\b|\bcodebeamer\b|\bintegrity (lifecycle|ptc)\b', weight: 1.5, have: 0.6}

  build_tools:
    Jenkins/CI: {re: '\bjenkins\b|\bci/cd\b|\bcontinuous integration\b|\bgitlab ci\b|\bgithub actions\b|\bazure devops\b', weight: 1.5, have: 1}
    Git: {re: '\bgit\b|\bgithub\b|\bgitlab\b|\bbitbucket\b', weight: 1, have: 1}
    Software integration/build/release: {re: '\bsoftware integration\b|\bintegration testing\b|\bbuild (system|environment|process)\b|\brelease management\b|\bmake ?files?\b|\bcmake\b', weight: 1.5, have: 0.6}
    Scripting (Bash/Perl/batch): {re: '\bbash\b|\bshell scripting\b|\bperl\b|\bpowershell\b', weight: 1, have: 0.3}

  languages:
    C: {re: '\bembedded c\b|\bc/c\+\+|\bc programming\b|\bc language\b|\bansi c\b|\b(?-i:C)\s*(,|/|and|or)\s*(c\+\+|python|assembly|matlab)\b|\bin c\b(?![+#])|\bc99\b|\bc11\b', weight: 2, have: 1}
    C++: {re: '\bc\+\+|\bcpp\b|\bmodern c\+\+', weight: 2, have: 0.8}
    Python: {re: '\bpython\b', weight: 1.5, have: 0.5}
    Assembly: {re: '\bassembly (language|code)\b|\bassembler\b', weight: 1.5, have: 0}
    C#/.NET: {re: '\bc#|\.net\b|\bc sharp\b', weight: 1.5, have: 0}
    Java: {re: '\bjava\b(?!script)', weight: 1.5, have: 0}
    Rust: {re: '\brust\b(?!\s+(belt|proof))', weight: 1.5, have: 0}
    Web/JavaScript: {re: '\bjavascript\b|\btypescript\b|\breact(\.js)?\b|\bnode\.?js\b|\bhtml\b', weight: 1, have: 0}

  networks:
    CAN/CAN FD: {re: '(?-i:\bCAN(?:[\s-]?FD)?\b)|\bcan[\s-]*(bus|fd|protocol|network|communication|messages?|signals?|database)\b|\bcontroller area network\b|\bdbc files?\b', weight: 2, have: 1}
    LIN: {re: '\blin\s*(bus|,|/|protocol|and)|\blocal interconnect network\b', weight: 1.5, have: 0.3}
    FlexRay: {re: '\bflexray\b', weight: 1.5, have: 0.2}
    Automotive Ethernet/SOME-IP: {re: '\bautomotive ethernet\b|\bsome/?ip\b|\bdoip\b|\b100base-t1\b|\btsn\b', weight: 2, have: 0}
    UDS/diagnostics: {re: '\buds\b|\b14229\b|\bunified diagnostic services\b|\bobd(-?ii)?\b|\bdtcs?\b|\bdiagnostic (trouble codes?|services|stack|protocols?)\b|\bodx\b', weight: 2, have: 0}
    J1939: {re: '\bj1939\b', weight: 1.5, have: 0}
    Vector CANoe/CANalyzer: {re: '\bcanoe\b|\bcanalyzer\b|\bvector tools?\b|\bvector (canoe|cast)\b', weight: 2, have: 0.3}
    CAPL: {re: '\bcapl\b', weight: 2, have: 0}
    Calibration (XCP/INCA/CANape): {re: '\bxcp\b|\bccp\b|\binca\b|\bcanape\b|\bcalibration tools?\b|\ba2l\b', weight: 2, have: 0}

  automotive_features:
    EPS/steering: {re: '\belectric power steering\b|\bpower steering\b|\bsteering (systems?|controls?|software|features?|gear|column|actuator|functions?)\b|\b(?-i:EPS)\b', weight: 3, have: 1}
    Steer-by-wire: {re: '\bsteer[\s-]*by[\s-]*wire\b|\bsbw\b|\bx[\s-]by[\s-]wire\b|\bby[\s-]wire\b', weight: 3, have: 1}
    ADAS: {re: '\badas\b|\badvanced driver[\s-]assist|\bdriver assistance\b|\blane (keep|keeping|centering|centring|departure|change assist)|\badaptive cruise\b|\bacc\b(?= |,)|\baeb\b|\bautomated driving\b|\bactive safety\b', weight: 2.5, have: 0.9}
    Vehicle dynamics/chassis: {re: '\bvehicle dynamics\b|\bchassis (controls?|systems?|software)\b|\bvehicle motion\b|\bmotion control\b', weight: 2, have: 0.5}
    Controls/algorithms: {re: '\bcontrols? (algorithms?|software|theory|strategy|strategies|design|systems?|engineering)\b|\bcontrol systems?\b|\bfeedback control\b|\bpid\b|\bclosed[\s-]loop\b|\bstate[\s-]machines?\b|\bcontrol laws?\b', weight: 2, have: 0.7}
    Motor control: {re: '\bmotor control\b|\bfoc\b|\bfield[\s-]oriented\b|\bbldc\b|\bpmsm\b|\bmotor drives?\b|\bpwm\b', weight: 2, have: 0.3}
    Powertrain/engine/transmission: {re: '\bpowertrain\b|\bengine control\b|\btransmission (control|software)\b|\bdriveline\b|\bpropulsion (controls?|software)\b|\be-?drive\b', weight: 2, have: 0.2}
    Battery/BMS: {re: '\bbms\b|\bbattery management\b|\bstate of charge\b|\bcell balancing\b', weight: 2, have: 0}
    Inverter/power electronics: {re: '\binverters?\b|\bpower electronics\b|\bdc[\s/-]?dc\b|\bon[\s-]board charger\b|\bobc\b', weight: 2, have: 0}
    Brakes: {re: '\bbrake (controls?|systems?|software)\b|\bbraking\b|\babs\b(?= |,)|\besc\b(?= |,)|\bbrake[\s-]by[\s-]wire\b', weight: 2, have: 0.2}
    ECU software: {re: '\becus?\b|\belectronic control units?\b|\bdomain controllers?\b|\bzonal\b|\bvehicle control units?\b|\bvcu\b', weight: 2, have: 1}
    Embedded software: {re: '\bembedded\s+(c\b|c/c\+\+|software|systems?|firmware|controls?|development|programming|applications?|targets?)', weight: 2, have: 1}
    Automotive software: {re: '\bautomotive (software|embedded|industry|domain|applications?|ecus?|systems?|oems?)\b|\boems?\b|\btier[\s-]?1\b', weight: 1.5, have: 1}

  low_level:
    Microcontrollers: {re: '\bmicro[\s-]*controllers?\b|\bmcus?\b|\baurix\b|\btricore\b|\brh850\b|\bs32k\b|\bc2000\b|\bstm32\b|\barm cortex\b|\bpowerpc\b', weight: 2, have: 0.2}
    RTOS: {re: '\brtos\b|\breal[\s-]time operating systems?\b|\bfreertos\b|\bosek\b|\bthreadx\b|\bzephyr\b|\bvxworks\b|\bsafertos\b|\bintegrity rtos\b', weight: 2, have: 0.2}
    Bootloaders: {re: '\bboot[\s-]?loaders?\b|\bflash(ing)? (drivers?|bootloader)\b|\breprogramming\b', weight: 2, have: 0}
    Device drivers/BSP: {re: '\bdevice drivers?\b|\bbsp\b|\bboard support packages?\b|\blow[\s-]level (software|drivers?|firmware)\b|\bbare[\s-]metal\b|\bperipheral drivers?\b|\b(spi|i2c|uart|adc)\b.{0,30}\b(drivers?|peripherals?)\b', weight: 2.5, have: 0}
    Embedded Linux/kernel: {re: '\blinux kernel\b|\bembedded linux\b|\byocto\b|\bbuildroot\b|\bkernel (drivers?|modules?|development)\b|\bdevice tree\b', weight: 2.5, have: 0}
    QNX: {re: '\bqnx\b', weight: 2, have: 0}
    Android Automotive: {re: '\bandroid (automotive|auto|os)\b|\baaos\b|\bandroid\b.{0,20}\b(framework|hal|platform)\b', weight: 2, have: 0}
    Multicore/concurrency: {re: '\bmulti[\s-]?core\b|\bmulti[\s-]?threading\b|\bconcurren(t|cy)\b|\bscheduling\b', weight: 1.5, have: 0.2}
    Debugging hardware (Lauterbach/JTAG/scope): {re: '\blauterbach\b|\btrace32\b|\bjtag\b|\boscilloscopes?\b|\blogic analy[sz]ers?\b|\bdebuggers?\b', weight: 1.5, have: 0}
    Hardware design (FPGA/PCB/analog): {re: '\bfpga\b|\bverilog\b|\bvhdl\b|\bpcb\b|\bschematics?\b|\banalog (design|circuits?)\b|\bcircuit design\b|\basic\b', weight: 2.5, have: 0}

  autonomy_ml:
    ROS: {re: '\bros\s?2?\b', weight: 2, have: 0}
    Perception/computer vision: {re: '\bperception\b|\bcomputer vision\b|\bobject detection\b|\bsensor fusion\b|\blidar\b|\bcamera (calibration|perception)\b|\bopencv\b', weight: 2, have: 0}
    Machine learning: {re: '\bmachine learning\b|\bdeep learning\b|\bneural networks?\b|\bpytorch\b|\btensorflow\b|\breinforcement learning\b', weight: 2, have: 0}
    Planning/localization: {re: '\b(path|motion|trajectory|behaviou?r) planning\b|\blocali[sz]ation\b|\bslam\b|\bmpc\b|\bmodel predictive\b', weight: 2, have: 0}
    State estimation (Kalman): {re: '\bkalman\b|\bstate estimation\b|\bobservers?\b(?= design)', weight: 1.5, have: 0.2}
    GPU/CUDA: {re: '\bcuda\b|\bgpu programming\b|\btensorrt\b', weight: 1.5, have: 0}

  other_software:
    Cloud/containers: {re: '\baws\b|\bazure\b|\bgcp\b|\bdocker\b|\bkubernetes\b|\bmicroservices?\b', weight: 1, have: 0}
    Databases/SQL: {re: '\bsql\b|\bpostgres|\bmongodb\b|\bdatabases?\b', weight: 1, have: 0}

# Title grades (first match wins at the highest score). Titles matching none get 0.45.
titles:
  - score: 1.0
    patterns:
      - '\bembedded\b.{0,25}\b(software|firmware|controls?|developer|programmer|sw)\b'
      - '\bcontrols?\b.{0,20}\b(software|sw)\b|\b(software|sw)\b.{0,20}\bcontrols?\b'
      - '\bmodel[\s-]*based\b|\bmbd\b|\bsimulink\b|\bautosar\b'
      - '\b(steering|eps|steer[\s-]*by[\s-]*wire|adas|chassis|driver assist\w*|active safety)\b.{0,40}\b(software|controls?|features?|functions?|algorithms?|integration)\b'
      - '\b(software|controls?|features?|functions?|algorithms?)\b.{0,40}\b(steering|steer[\s-]*by[\s-]*wire|adas|chassis|driver assist\w*)\b'
      - '\b(application|ecu|vehicle|automotive|feature)\s+software\b'
      - '\bsoftware (integration|feature|function)\b'
      - '\b(mil|sil)\b.{0,20}\b(engineer|test|validation)\b'
  - score: 0.85
    patterns:
      - '\bfirmware\b'
      - '\b(vehicle|powertrain|chassis|propulsion|motor|brake|battery|thermal|engine|transmission)\s+controls?\b'
      - '\b(controls?|algorithms?|planning|motion)\b.{0,15}\b(engineer|developer)\b'
      - '\bfunctional safety\b.{0,20}\b(software|engineer)\b'
      - '\b(software|sw)\b.{0,15}\b(verification|validation|test)\b'
      - '\bcalibration engineer\b'
      - '\bsoftware engineer\b.{0,30}\b(vehicle|automotive|embedded|adas|controls?)\b'
  - score: 0.7
    patterns:
      - '\bsystems? engineer\b.{0,30}\b(software|controls?|vehicle|adas|e/e|electrical|electronics)\b'
      - '\b(software|controls?|vehicle|adas|e/e)\b.{0,30}\bsystems? engineer\b'
      - '\b(hil|validation|verification|integration|test)\b.{0,20}\b(engineer|developer)\b'
      - '\b(simulation|robotics)\b.{0,25}\b(engineer|software)\b'
      - '\bmechatronics?\b'
  - score: 0.55
    patterns:
      - '\bsoftware\b.{0,20}\b(engineer|developer)\b'
      - '\bsystems? engineer\b'

# Industry grades (the best match in the job text wins). Text matching none gets 0.7.
domains:
  - score: 1.0
    patterns:
      - '\bautomotive\b|\bvehicles?\b|\boems?\b|\btier[\s-]?1\b|\badas\b|\bautonomous driving\b|\bpowertrain\b|\bchassis\b'
      - '\belectric vehicles?\b|\b(?-i:EV)s?\b|\btrucks?\b|\boff[\s-]highway\b|\bconstruction equipment\b|\bagricultur\w+ (equipment|machinery)\b|\bmotorsport'
  - score: 0.8
    patterns:
      - '\baerospace\b|\bavionics\b|\baircraft\b|\bevtol\b|\bflight (controls?|software)\b|\brail(way)?\b|\bmarine\b'
  - score: 0.75
    patterns:
      - '\brobot(s|ics)?\b|\bindustrial automation\b|\bsemiconductors?\b'
  - score: 0.65
    patterns:
      - '\bmedical\b|\bsurgical\b|\bhealthcare\b|\bconsumer electronics\b|\bwearables?\b|\bsmart home\b|\bdata cent(er|re)\b'
