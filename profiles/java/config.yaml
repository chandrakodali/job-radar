# Java Developer Radar: Java developer jobs in the US posted in the last 7 days, under 5 years asked.
# Same rules as the DevOps radar (US only; 5+ years, clearance or citizenship left out; senior titles kept
# when they ask under 5 years; no-sponsorship and staffing jobs kept and flagged). Titles with Java (not
# JavaScript) are direct matches; backend/software/full-stack titles count only when the requirements need
# Java. Reads the same employer boards as the DevOps radar.
