description:
  blockers:
  - (security|secret|top secret|ts/sci|ts|sci|dod|public trust)\s+clearance
  - clearance (is |will be )?required
  - active (secret|top secret|ts/sci|ts)\b
  - ability to (obtain|maintain) (a |an )?(\w+ )?(security )?clearance
  - must (be|hold) (a |an )?(u\.?s\.?|united states) citizen
  - (u\.?s\.?|united states) citizenship (is )?(required|is a requirement|needed)
  - requires? (u\.?s\.?|united states) citizenship
  - (must be|only) (a )?(u\.?s\.?|us) persons?
  - \bitar\b
  - export control.{0,80}(u\.?s\.? person|citizen)
  blocker_exceptions:
  - no (security )?clearance (is )?required
  - clearance (is )?not required
  - does not require (a |an )?(security )?clearance
  no_sponsorship:
  - (not|unable to|cannot|can.t|will not|won.t|does not|do not|is not able to)\s+(provide |offer |support )?(employment |work )?(visa )?sponsor
  - sponsorship (is )?(not|un)available
  - without (the )?(need for )?(current or future |now or in the future )?(employer |visa )?sponsorship
  - now or in the future.{0,60}sponsor
  sponsors:
  - visa sponsorship (is )?available
  - will sponsor
  - sponsorship (is )?available
  - open to sponsor
  e_verify:
  - e-?verify
