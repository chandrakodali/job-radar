workday:
  shards: 1
  max_pages: 15
  search_terms: ['junior', 'associate', 'entry level', 'new grad', 'early career', 'graduate', 'engineer I']   # big boards: also search these
  search_pages: 2
notify:
  daily_digest_hour_local: 8
  timezone: America/Chicago
ai:
  mode: 'off'
discovery:
  boards_per_run: 100000
run:
  time_budget_minutes: 28
report:
  order: newest
  days: 7
  hide_years: 2
  track_closed: true
  label: IT entry-level jobs in the US (0–1 year, any area of IT)
  note: 'US jobs only, any area of IT, kept only when they show they''re entry level: an entry-level title (junior, associate, new grad, I/1...), entry-level wording in the text, or 0–1 years asked. Jobs
    asking for 2+ years, or needing a clearance or US citizenship, are left out (listed at the end). "date only" means the board gives the day but not the time.'
sources:
